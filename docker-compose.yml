# One command, no manual steps:
#
#   docker compose up --build
#
# brings up Postgres, creates and seeds the database and serves the API on
# http://localhost:8150. `docker compose --profile test run --rm test` runs the
# suite against a throwaway test database in the same image.

services:
  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: he_better_reads
      POSTGRES_PASSWORD: he_better_reads
      POSTGRES_DB: he_better_reads_production
    ports:
      # Exposed for psql from the host; the app talks to it over the network
      # that Compose creates, not through this mapping.
      - "8151:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U he_better_reads -d he_better_reads_production"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_MAX_THREADS: "5"
      DATABASE_URL: postgres://he_better_reads:he_better_reads@db:5432/he_better_reads_production
    ports:
      - "8150:3000"
    depends_on:
      db:
        condition: service_healthy

  # `docker compose --profile test run --rm test`
  test:
    profiles: ["test"]
    build:
      context: .
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgres://he_better_reads:he_better_reads@db:5432/he_better_reads_test
      SKIP_DB_PREPARE: "1"
    command: >
      bash -c "bundle exec rails db:test:prepare && bundle exec rspec"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
