# Development and test connect as the current OS user over the local socket.
# Docker Compose and production set DATABASE_URL, which Rails merges on top.
default: &default
  adapter: postgresql
  encoding: unicode
  # Matches Puma's thread count; see config/puma.rb.
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: he_better_reads_development

# Erased and rebuilt by the test suite. Never point it at another database.
test:
  <<: *default
  database: he_better_reads_test

production:
  <<: *default
  database: he_better_reads_production
  username: he_better_reads
  password: <%= ENV["HE_BETTER_READS_DATABASE_PASSWORD"] %>
